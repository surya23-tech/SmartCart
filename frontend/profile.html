<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile - SmartCart</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="logo"><i>Smart</i>Cart</div>
        <div class="nav-links">
            <a href="index.html">🏠 Home</a>
            <a href="index.html#productsSection">📦 Products</a>
            <a href="cart.html">🛒 Cart</a>
            <a href="#" onclick="logout()" id="logoutLink">🚪 Logout</a>
        </div>
    </nav>
    <section class="profile-section">
        <div class="profile-card">
            <div class="profile-header">
                <img src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png" alt="Profile Avatar" class="profile-avatar">
                <h1 class="profile-title">My Profile</h1>
            </div>
            <form id="profileForm" class="profile-form">
                <div class="profile-fields">
                    <div class="form-group">
                        <label for="profileName">Full Name</label>
                        <input type="text" id="profileName" name="name" placeholder="John Doe" required>
                    </div>
                    <div class="form-group">
                        <label for="profileEmail">Email</label>
                        <input type="email" id="profileEmail" name="email" placeholder="john@example.com" readonly>
                    </div>
                    <div class="form-group">
                        <label for="profileMobile">Mobile Number</label>
                        <input type="text" id="profileMobile" name="mobile" placeholder="+91 9876543210" maxlength="15">
                    </div>
                    <div class="form-group">
                        <label for="profileAddress">Address</label>
                        <input type="text" id="profileAddress" name="address" placeholder="123 Main Street">
                    </div>
                    <div class="form-group">
                        <label for="profileCity">City</label>
                        <input type="text" id="profileCity" name="city" placeholder="Mumbai">
                    </div>
                    <div class="form-group">
                        <label for="profileState">State</label>
                        <input type="text" id="profileState" name="state" placeholder="Maharashtra">
                    </div>
                    <div class="form-group">
                        <label for="profilePincode">Pincode</label>
                        <input type="text" id="profilePincode" name="pincode" placeholder="400001" maxlength="10">
                    </div>
                </div>
                <button type="submit" class="profile-save-btn">Save Changes</button>
            </form>
        </div>
    </section>
    <script src="script.js"></script>
</body>
</html>
