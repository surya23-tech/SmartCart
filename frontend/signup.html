<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup - SmartCart</title>
    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, sans-serif;
        }

        body{
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url("https://images.unsplash.com/photo-1523381210434-271e8be1f52b");
            background-size:cover;
            background-position:center;
        }

        .signup-box{
            width:350px;
            background:white;
            padding:40px;
            border-radius:15px;
            text-align:center;
            box-shadow:0 0 20px rgba(0,0,0,0.3);
        }

        .signup-box h1{
            margin-bottom:30px;
            font-size:45px;
            color: #333;
        }

        .signup-box input{
            width:100%;
            padding:15px;
            margin-bottom:20px;
            border:1px solid #ccc;
            border-radius:10px;
            font-size:16px;
        }

        .signup-box button{
            width:100%;
            padding:15px;
            border:none;
            border-radius:10px;
            background:#4CAF50;
            color:white;
            font-size:20px;
            cursor:pointer;
        }

        .signup-box button:hover{
            background:#2e8b57;
        }

        .signup-box p{
            margin-top:20px;
            font-size:17px;
            color: #555;
        }

        .signup-box a{
            text-decoration:none;
            color:#4CAF50;
            font-weight:bold;
        }
    </style>
</head>
<body>
    <div class="signup-box">
        <div style="text-align: center; margin-bottom: 15px;">
            <h2 style="color: #2874f0; margin: 0 0 5px 0; font-size: 26px;">🛍️ Welcome to SmartCart</h2>
            <p style="color: #666; font-size: 14px; margin: 0;">Best Products at Best Prices</p>
        </div>
        <h1 style="margin-bottom: 20px;">✍️ Signup</h1>
        <input type="text" id="name" placeholder="Enter Name">
        <input type="email" id="email" placeholder="Enter Email">
        <input type="password" id="password" placeholder="Enter Password">
        <button onclick="signup()">Signup</button>
        <p>
            Already have an account?
            <a href="login.html">🔐 Login</a>
        </p>
    </div>

    <script>
        async function signup(){
            const name = document.getElementById("name").value;
            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;

            try {
                const response = await fetch("http://localhost:5000/api/users/register",{
                    method:"POST",
                    headers:{
                        "Content-Type":"application/json"
                    },
                    body: JSON.stringify({
                        name,
                        email,
                        password
                    })
                });

                const data = await response.json();
                
                if (response.ok) {
                    alert("Signup successful!");
                    localStorage.setItem("isLoggedIn", "true");
                    localStorage.setItem("userEmail", email);
                    window.location.href = "index.html";
                } else {
                    alert(data.message || "Signup failed");
                }
            } catch (error) {
                console.log(error);
                alert("Server Error");
            }
        }
    </script>
</body>
</html>s
